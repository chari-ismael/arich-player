<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARICH</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#080a0f" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
</head>
<body style="background:#080a0f;color:#f0efec;font-family:system-ui,sans-serif">
  <script>
    (function () {
      var PKG = 'com.arich.iptv';
      var segs = location.pathname.replace(/^\/+|\/+$/g, '').split('/').filter(Boolean);
      var head = (segs[0] || '').toLowerCase();
      var android = /Android/i.test(navigator.userAgent);
      var web = new URLSearchParams(location.search).get('web') === '1';
      var isLink = head === 'm' || head === 'matchs' || head === 'v' || head === 'f';
      var path = location.pathname + location.search.replace(/[?&]web=1/, '');

      if (head === 'download' || head === 'download.html') {
        location.replace('/download/' + location.search + location.hash);
        return;
      }

      function intent(p) {
        var fallback = 'https://arich.fr' + p + (p.indexOf('?') >= 0 ? '&' : '?') + 'web=1';
        return 'intent://arich.fr' + p + '#Intent;scheme=https;package=' + PKG +
          ';S.browser_fallback_url=' + encodeURIComponent(fallback) + ';end';
      }

      if (isLink && android && !web) {
        location.replace(intent(path));
        return;
      }
      if (head === 'm' || head === 'matchs') {
        var id = head === 'm' ? (segs[1] || '') : '';
        if (!android && !web) {
          location.href = 'com.arich.iptv://' + segs.join('/');
          setTimeout(function () {
            location.replace('/matchs?web=1' + (id ? '&id=' + encodeURIComponent(id) : ''));
          }, 1200);
          return;
        }
        location.replace('/matchs?web=1' + (id ? '&id=' + encodeURIComponent(id) : ''));
        return;
      }
      document.title = isLink ? 'Ouvrir ARICH' : 'Page introuvable — ARICH';
      document.body.style.cssText = 'min-height:100vh;display:grid;place-items:center;background:#080a0f;color:#f0efec;font-family:Figtree,system-ui,sans-serif;text-align:center;padding:32px';
      document.body.innerHTML = isLink
        ? '<div><p style="margin-bottom:16px">Ouvrez ce contenu dans ARICH Player.</p><p><a href="https://arich.fr/download" style="color:#d4a04a">Télécharger l'app</a> · <a href="https://play.google.com/store/apps/details?id=' + PKG + '" style="color:#d4a04a">Play Store</a></p></div>'
        : '<div><h1>404</h1><p>Cette page n'existe pas.</p><p><a href="/" style="color:#d4a04a">Accueil</a></p></div>';
    })();
  </script>
</body>
</html>
