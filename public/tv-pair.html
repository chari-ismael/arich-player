<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARICH — Lier ma TV</title>
  <meta name="description" content="Ouvrir ARICH pour envoyer votre playlist à la TV Samsung." />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#0a0c11" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0c11;
      color: #f0efec;
      font-family: Figtree, system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #12141c;
      border: 1px solid rgba(240,239,236,.1);
      border-radius: 20px;
      padding: 32px 28px 28px;
    }
    .brand {
      font-family: Syne, sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .28em;
      color: rgba(240,239,236,.45);
      margin-bottom: 18px;
    }
    h1 {
      font-family: Syne, sans-serif;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .lead { color: rgba(240,239,236,.58); font-size: 15px; line-height: 1.5; margin-bottom: 22px; }
    .code-row {
      display: flex;
      justify-content: center;
      margin: 0 0 22px;
    }
    .code-char {
      width: 42px; height: 52px;
      margin: 0 3px;
      border: 1.5px solid #f2a51b;
      border-radius: 10px;
      background: rgba(242,165,27,.08);
      display: flex; align-items: center; justify-content: center;
      font-family: Syne, sans-serif;
      font-size: 24px; font-weight: 800;
      color: #f2a51b;
    }
    .code-input {
      width: 100%;
      text-align: center;
      font-family: Syne, sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: .28em;
      padding: 16px 12px;
      margin-bottom: 18px;
      border-radius: 12px;
      border: 1.5px solid rgba(240,239,236,.12);
      background: rgba(240,239,236,.04);
      color: #fff;
      text-transform: uppercase;
    }
    .code-input:focus { outline: none; border-color: #f2a51b; }
    .btn {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary { background: #f2a51b; color: #0a0c11; }
    .btn-ghost {
      background: transparent;
      color: #f0efec;
      border: 1px solid rgba(240,239,236,.16);
      margin-top: 10px;
    }
    .hint { margin-top: 16px; font-size: 13px; color: rgba(240,239,236,.5); line-height: 1.45; }
    .msg { margin-top: 14px; font-size: 14px; font-weight: 600; display: none; }
    .msg.ok { color: #22c55e; display: block; }
    .msg.err { color: #ef4444; display: block; }
    details { margin-top: 22px; color: rgba(240,239,236,.5); font-size: 14px; }
    details summary { cursor: pointer; margin-bottom: 12px; }
    label { display: block; font-size: 12px; font-weight: 600; margin: 10px 0 6px; color: rgba(240,239,236,.7); }
    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(240,239,236,.12);
      background: rgba(240,239,236,.04);
      color: #fff;
      font: inherit;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">ARICH</div>
    <h1>Lier ma TV</h1>
    <p class="lead" id="lead">Ouvrez l’application ARICH pour envoyer la playlist déjà enregistrée.</p>

    <div id="codeBadge" class="code-row"></div>
    <input id="codeManual" class="code-input hidden" maxlength="6" placeholder="ABC123" autocomplete="off" autocapitalize="characters" />

    <button type="button" class="btn btn-primary" id="btnOpenApp">Ouvrir ARICH</button>
    <button type="button" class="btn btn-ghost" id="btnStay">Je tape le code dans l’app</button>

    <p class="hint" id="hint">Si l’app ne s’ouvre pas : ARICH → Réglages → Lier ma TV, puis ce code.</p>
    <div id="statusMsg" class="msg"></div>

    <details id="fallback">
      <summary>Pas d’application ? Envoyer Xtream / M3U ici</summary>
      <form id="pairForm">
        <label>Type</label>
        <select id="type">
          <option value="xtream">Xtream Codes</option>
          <option value="m3u">Playlist M3U</option>
        </select>
        <div id="fields-xtream">
          <label>Serveur</label>
          <input id="xtream-server" placeholder="http://serveur.com" />
          <label>Utilisateur</label>
          <input id="xtream-user" />
          <label>Mot de passe</label>
          <input id="xtream-pass" type="password" />
        </div>
        <div id="fields-m3u" class="hidden">
          <label>URL M3U</label>
          <input id="m3u-url" placeholder="http://serveur.com/playlist.m3u" />
        </div>
        <button type="submit" class="btn btn-primary" id="btnSubmit" style="margin-top:16px">Envoyer à la TV</button>
      </form>
    </details>
  </div>

  <script>
    var API_ENDPOINT = 'https://aynucieohuowgkwyftiy.supabase.co/functions/v1/pairing/api/submit';
    var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5bnVjaWVvaHVvd2drd3lmdGl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyOTIxMDMsImV4cCI6MjA4Nzg2ODEwM30.H43CVcyzEuYBQfBIlkn16r5uk768isHr4DeLduo1ETk';

    var params = new URLSearchParams(window.location.search);
    var codeVal = (params.get('code') || params.get('tv_pair') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    var tvId = (params.get('tv') || '').trim();
    var stayPage = params.get('stay') === '1';

    var codeBadge = document.getElementById('codeBadge');
    var codeManual = document.getElementById('codeManual');
    var btnOpenApp = document.getElementById('btnOpenApp');
    var btnStay = document.getElementById('btnStay');
    var hint = document.getElementById('hint');

    function currentCode() {
      return (codeVal || codeManual.value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    }

    function appPairUrl() {
      var c = currentCode();
      var qs = 'code=' + encodeURIComponent(c);
      if (tvId) qs += '&tv=' + encodeURIComponent(tvId);
      return 'com.arich.iptv://tv-pair?' + qs;
    }

    function intentPairUrl() {
      var c = currentCode();
      var fallback = 'https://arich.fr/tv-pair.html?stay=1&code=' + encodeURIComponent(c);
      if (tvId) fallback += '&tv=' + encodeURIComponent(tvId);
      return 'intent://tv-pair?code=' + encodeURIComponent(c) +
        (tvId ? '&tv=' + encodeURIComponent(tvId) : '') +
        '#Intent;scheme=com.arich.iptv;package=com.arich.iptv;S.browser_fallback_url=' +
        encodeURIComponent(fallback) + ';end';
    }

    function openApp() {
      var c = currentCode();
      if (c.length < 6) {
        showMsg('Entrez le code à 6 lettres affiché sur la TV.', false);
        return;
      }
      codeVal = c;
      window.location.href = intentPairUrl();
    }

    function renderCode(c) {
      codeBadge.innerHTML = '';
      if (!c) return;
      c.split('').forEach(function (ch) {
        var el = document.createElement('div');
        el.className = 'code-char';
        el.textContent = ch;
        codeBadge.appendChild(el);
      });
    }

    function showMsg(text, ok) {
      var msg = document.getElementById('statusMsg');
      msg.textContent = text;
      msg.className = 'msg ' + (ok ? 'ok' : 'err');
    }

    btnOpenApp.onclick = openApp;
    btnStay.onclick = function () {
      showMsg('Dans ARICH : Réglages → Lier ma TV, puis le code ci-dessus.', true);
    };

    document.getElementById('type').onchange = function () {
      var t = this.value;
      document.getElementById('fields-xtream').className = t === 'xtream' ? '' : 'hidden';
      document.getElementById('fields-m3u').className = t === 'm3u' ? '' : 'hidden';
    };

    if (codeVal.length >= 6) {
      renderCode(codeVal);
      if (!stayPage) {
        setTimeout(openApp, 250);
      }
    } else {
      codeManual.classList.remove('hidden');
      hint.textContent = 'Tapez le code de la TV, puis Ouvrir ARICH — ou saisissez-le dans l’app : Réglages → Lier ma TV.';
    }

    document.getElementById('pairForm').onsubmit = function (e) {
      e.preventDefault();
      var code = currentCode();
      if (code.length < 6) {
        showMsg('Code d’appairage invalide.', false);
        return;
      }
      var type = document.getElementById('type').value;
      var config = { type: type };
      if (type === 'xtream') {
        config.name = 'Xtream IPTV';
        config.server = document.getElementById('xtream-server').value.trim();
        config.username = document.getElementById('xtream-user').value.trim();
        config.password = document.getElementById('xtream-pass').value.trim();
        if (!config.server || !config.username || !config.password) {
          showMsg('Remplissez serveur, utilisateur et mot de passe.', false);
          return;
        }
      } else {
        config.name = 'Playlist M3U';
        config.url = document.getElementById('m3u-url').value.trim();
        if (!config.url) {
          showMsg('Entrez le lien M3U.', false);
          return;
        }
      }
      var btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      fetch(API_ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': ANON_KEY,
          'Authorization': 'Bearer ' + ANON_KEY
        },
        body: JSON.stringify({ code: code, config: config })
      })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res && res.ok) {
          showMsg('Envoyé. Regardez la TV.', true);
          btn.textContent = 'Transmis';
        } else {
          btn.disabled = false;
          showMsg(res && res.error ? String(res.error) : 'Code invalide ou expiré.', false);
        }
      })
      .catch(function () {
        btn.disabled = false;
        showMsg('Erreur de connexion. Réessayez.', false);
      });
    };
  </script>
</body>
</html>
